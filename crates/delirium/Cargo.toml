[package]
name = "delirium"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
bevy = ["dep:bevy_ecs"]
# Portal mode: portals' holes in the world.
portal = []
# The parameter audit: what each message reads and its default (the param_audit example).
param-audit = []

[dependencies]
delirium-data = { path = "../delirium-data" }
bevy_math = { version = "=0.20.0", default-features = false, features = ["std"] }
bevy_transform = { version = "=0.20.0", default-features = false, features = ["std"] }
bevy_tasks = { version = "=0.20.0", default-features = false, features = ["multi_threaded"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.20.0", optional = true }

[[example]]
name = "param_audit"
required-features = ["param-audit"]
